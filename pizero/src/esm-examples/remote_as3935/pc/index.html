<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
<style>
#statusBanner {
  padding: 1em;
  font-size: 1.5em;
  text-align: center;
  background: #eee;
  transition: background-color 0.3s;
}
#statusBanner.detected { background: #ffe08a; }
</style>
</head>
<script type="module" src="pc.js"></script>
<body>
<h3 id="deviceTitle">Remote AS3935 - 雷センサー</h3>

<div id="statusBanner">待機中... ⛅</div>

<table border="1">
<tr><th>Name</th><th>Value</th></tr>
<tr><td>distance (km)</td><td id="distTd">-</td></tr>
<tr><td>energy</td><td id="energyTd">-</td></tr>
<tr><td>detected at</td><td id="timeTd">-</td></tr>
</table>

<div id="messageDiv"></div>
</body>
</html>
