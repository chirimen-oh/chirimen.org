<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
</head>
<script type="module" src="pc.js"></script>
<body>
<h3 id="deviceTitle">Remote A4988 ステッピングモータ制御</h3>

<p>
<label>回転方向:
<select id="directionSelect">
<option value="1">正転</option>
<option value="0">逆転</option>
</select>
</label>
</p>
<p>
<label>ステップ数:
<input id="stepsInput" type="number" value="100" min="1" max="2000" />
</label>
</p>
<p>
<button id="sendButton" type="button">回転開始</button>
</p>

<div id="messageDiv"></div>
</body>
</html>
