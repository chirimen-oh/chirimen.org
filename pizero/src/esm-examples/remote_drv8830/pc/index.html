<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
</head>
<script type="module" src="pc.js"></script>
<body>
<h3 id="deviceTitle">Remote DC Motor Example - Controller</h3>
<p>スライダーを離したタイミングで、その電圧(V)をリレーサービスに送ります。0で停止、正の値で正転、負の値で逆転します。</p>
<input id="voltageInput" type="range" value="0" min="-5" max="5" step="0.1"
  onchange="sendVoltage(event)" oninput="showVoltage(event)"><span id="voltageGuide">0</span>

<div id="messageDiv"></div>
</body>
</html>
