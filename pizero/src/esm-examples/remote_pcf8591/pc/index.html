<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
</head>
<script type="module" src="pc.js"></script>
<body>
<h3 id="deviceTitle">Remote Example - PCF8591 AD/DA Converter</h3>

<p>ADC値(電圧)が数秒間隔で自動更新されます。</p>
<table border="1">
<tr><th>CH</th><th>Value(V)</th></tr>
<tr><td>0</td><td id="ch0Td">-</td></tr>
<tr><td>1</td><td id="ch1Td">-</td></tr>
<tr><td>2</td><td id="ch2Td">-</td></tr>
<tr><td>3</td><td id="ch3Td">-</td></tr>
</table>

<p>スライダーを離したタイミングで、DA出力電圧をPi Zeroに送信します。</p>
<input
  id="voltageInput"
  type="range"
  value="0"
  min="0"
  max="3.3"
  step="0.1"
/><span id="voltageGuide">0</span> V

<div id="messageDiv"></div>
</body>
</html>
