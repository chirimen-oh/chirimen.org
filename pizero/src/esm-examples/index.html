<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>
      ECMA Script Module Examples for CHIRIMEN with Node.js/Rarpberry Pi Zero
    </title>
  </head>
  <script>
    const exData = {};
    let iframeReferrer = null;
    onload = async function () {
      // check if this window is inside iframe
      if (window.self !== window.top) {
        iframeReferrer = document.referrer;
      }

      await getData();
      for (const cat in exData) {
        buildTable(cat);
      }
      setTimeout(function () {
        const te = document.getElementById(location.hash.substring(1));
        if (te) {
          te.style.backgroundColor = "yellow";
          te.scrollIntoView();
        }
      }, 10);
    };

    async function getData() {
      const response = await fetch("index_examples.csv");
      let csv = await response.text();
      csv = csv.split("\n");
      let cat;
      for (let line of csv) {
        if (line.length > 1 && line.indexOf("#") != 0) {
          line = line.split(",");
          if (line.length == 1) {
            cat = line[0];
            //console.log("CATEGORY::",cat);
            exData[cat] = [];
          } else {
            exData[cat].push(line);
            //console.log(line);
          }
        }
      }
      console.log(exData);
    }
    let co_base = "https://chirimen.org/chirimen/gc/top/examples/#";
    function buildTable(cat) {
      const tbl = document.getElementById("Tbl" + cat);
      const catData = exData[cat];
      console.log(tbl, catData);
      if (cat == "REMOTE") {
        tbl.insertAdjacentHTML(
          "afterbegin",
          '<tr><td width="100">ID</td><td width="200">タイトル</td><td width="400">概要</td><td>回路図</td><td>JS GET</td><td>PC側webApp (CodeSandbox)</td>',
        );
      } else {
        tbl.insertAdjacentHTML(
          "afterbegin",
          '<tr><td width="100">ID</td><td width="200">タイトル</td><td width="400">概要</td><td>回路図</td><td>JS GET</td>',
        );
      }
      for (const item of catData) {
        const id_td = document.createElement("td");
        id_td.innerText = item[0];

        const title_td = document.createElement("td");
        title_td.innerText = item[1];

        const exp_td = document.createElement("td");
        exp_td.innerHTML = item[2];

        const sch_td = document.createElement("td");
        sch_td.innerHTML = `<a href='https://github.com/chirimen-oh/chirimen.org/tree/master/pizero/src/esm-examples/${item[0]}#readme' target='_schematics'>回路図</a>`;

        const js_td = document.createElement("td");
        if (iframeReferrer) {
          js_td.innerHTML =
            "<input type='button' value='JS GET' onclick='jsGet(\"" +
            item[0] +
            '","' +
            cat +
            "\")'></input>";
        } else {
          js_td.innerHTML =
            "<a href='./" + item[0] + "/main.js' target='_js'>JS GET</a>";
        }

        const tr = document.createElement("tr");
        tr.setAttribute("id", cat + "_" + item[0]);
        tr.dataset.search =
          `${item[0]} ${item[1]} ${exp_td.textContent}`.toLowerCase();
        tr.appendChild(id_td);
        tr.appendChild(title_td);
        tr.appendChild(exp_td);
        tr.appendChild(sch_td);
        tr.appendChild(js_td);

        if (cat == "REMOTE") {
          const pc_td = document.createElement("td");
          pc_td.innerHTML =
            "<a href='" +
            getRemotePcCsb(item[0]) +
            "' target='_pcCsb'>CSB EDIT</a>";
          tr.appendChild(pc_td);
        }

        tbl.appendChild(tr);
      }
      filterRows(document.getElementById("filterInput").value);
    }

    function filterRows(keyword) {
      keyword = keyword.trim().toLowerCase();
      let totalVisible = 0;
      let totalRows = 0;
      for (const tbl of document.querySelectorAll("table[id^='Tbl']")) {
        const rows = tbl.querySelectorAll("tr[data-search]");
        let visibleCount = 0;
        for (const tr of rows) {
          const match = !keyword || tr.dataset.search.includes(keyword);
          tr.style.display = match ? "" : "none";
          if (match) visibleCount++;
        }
        const heading = tbl.previousElementSibling;
        tbl.style.display = visibleCount > 0 ? "" : "none";
        if (heading) heading.style.display = visibleCount > 0 ? "" : "none";
        totalVisible += visibleCount;
        totalRows += rows.length;
      }
      const countEl = document.getElementById("filterCount");
      if (countEl) {
        countEl.textContent = keyword
          ? `${totalVisible}/${totalRows} 件`
          : `${totalRows} 件`;
      }
    }

    let defDir = "https://chirimen.org/pizero/esm-examples/";
    function jsGet(eid, cat) {
      const thisURL = new URL(window.location.href);
      defDir =
        thisURL.origin +
        thisURL.pathname.substring(0, thisURL.pathname.lastIndexOf("/") + 1);

      const jsURL = defDir + eid + "/main.js";
      //console.log("jsGet:",eid,jsURL);
      //console.log("postMessage:",jsURL,new URL(iframeReferrer).origin);
      parent.window.postMessage(
        { req: "getSrc", url: jsURL, exampleId: eid, category: cat },
        new URL(iframeReferrer).origin,
      );
    }

    function getRemotePcCsb(exId) {
      const csbUrl = `https://codesandbox.io/s/github/chirimen-oh/chirimen.org/tree/master/pizero/src/esm-examples/${exId}/pc?module=pc.js`;
      return csbUrl;
    }
  </script>
  <body>
    <h2>CHIRIMEN with Node.js / RPi Zero Examples</h2>
    <div>
      <label for="filterInput">絞り込み: </label>
      <input
        type="search"
        id="filterInput"
        placeholder="ID・タイトル・概要"
        oninput="filterRows(this.value)"
        style="width: 300px"
        autofocus
      />
      <p id="filterCount"></p>
    </div>
    <h3 id="gpio">GPIO Examples</h3>
    <table border="1" id="TblGPIO"></table>
    <h3 id="i2c">I2C Examples</h3>
    <table border="1" id="TblI2C"></table>
    <h3 id="remote">REMOTE Examples</h3>
    <table border="1" id="TblREMOTE"></table>
    <!--<a href="https://chirimen.org/chirimen/gc/top/examples/#i2cExamples">詳しくはこちらを見てね</a>-->
    <p><a href="../package.json">Latest package.json</a></p>
  </body>
</html>
