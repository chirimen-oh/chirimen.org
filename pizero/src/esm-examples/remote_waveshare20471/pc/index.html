<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
</head>
<script type="module" src="pc.js"></script>
<body>
<h3 id="deviceTitle">Remote Example - WAVESHARE20471 複合センサボード Display</h3>

<table border="1">
<tr><th>Name</th><th>Value</th></tr>
<tr><td>pressure (hPa)</td><td id="pressureTd">-</td></tr>
<tr><td>temperature (&deg;C)</td><td id="temperatureTd">-</td></tr>
<tr><td>humidity (%)</td><td id="humidityTd">-</td></tr>
<tr><td>lux</td><td id="luxTd">-</td></tr>
<tr><td>UVS (raw)</td><td id="uvsTd">-</td></tr>
<tr><td>gas (raw)</td><td id="gasTd">-</td></tr>
<tr><td>roll</td><td id="rollTd">-</td></tr>
<tr><td>pitch</td><td id="pitchTd">-</td></tr>
<tr><td>yaw</td><td id="yawTd">-</td></tr>
<tr><td>acceleration X</td><td id="accelXTd">-</td></tr>
<tr><td>acceleration Y</td><td id="accelYTd">-</td></tr>
<tr><td>acceleration Z</td><td id="accelZTd">-</td></tr>
<tr><td>gyroscope X</td><td id="gyroXTd">-</td></tr>
<tr><td>gyroscope Y</td><td id="gyroYTd">-</td></tr>
<tr><td>gyroscope Z</td><td id="gyroZTd">-</td></tr>
<tr><td>magnetic X</td><td id="magXTd">-</td></tr>
<tr><td>magnetic Y</td><td id="magYTd">-</td></tr>
<tr><td>magnetic Z</td><td id="magZTd">-</td></tr>
</table>
<div id="messageDiv"></div>
</body>
</html>
